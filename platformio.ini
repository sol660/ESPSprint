[env]
; Let lib/ modules see include/config.h.
build_flags = -Iinclude
; test/hil is the pytest board suite (run from the PC), not a PlatformIO test suite.
test_ignore = hil/*

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; On-board hardware tests only; logic tests run on the PC in [env:native].
test_filter = embedded/*

; Board-test build (spec #14 "Test build"): the same firmware with short timings
; (30 s wake interval, 10 s command window, 20 s session idle; see include/config.h),
; so test/hil/board/test_sleep.py can watch real deep sleep in seconds.
; Flash with `pio run -e esp32dev_hil -t upload`; flash esp32dev again afterwards.
[env:esp32dev_hil]
extends = env:esp32dev
build_flags = ${env.build_flags} -DESPSPRINT_HIL_TIMINGS

; Hardware-free tests of the wake-cycle core on the dev PC (MinGW gcc).
[env:native]
platform = native
build_flags = ${env.build_flags} -std=gnu++17
test_filter = native/*
extra_scripts = pre:scripts/native_toolchain.py
