[env]
; Let lib/ modules see include/config.h.
build_flags = -Iinclude
; test/hil is the pytest board suite (run from the PC), not a PlatformIO test suite.
test_ignore = hil/*

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; On-board hardware tests only; logic tests run on the PC in [env:native].
test_filter = embedded/*

; Hardware-free tests of the wake-cycle core on the dev PC (MinGW gcc).
[env:native]
platform = native
build_flags = ${env.build_flags} -std=gnu++17
test_filter = native/*
extra_scripts = pre:scripts/native_toolchain.py
